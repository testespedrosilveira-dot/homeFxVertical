<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.stage{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

/* LETTERS */

.slide{
    position:absolute;
    left:50%;
    top:50%;
    width:180px;
    height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:170px;
    font-weight:400;
    line-height:1;
    color:#c3c3c3;
    transform:translate(-50%,-50%);
    transition:
        transform .45s cubic-bezier(.22,.61,.36,1),
        opacity .35s;
    will-change:transform;
}

/* CENTER BOX */

.center{
    position:absolute;
    left:50%;
    top:50%;
    width:165px;
    height:165px;
    transform:translate(-50%,-50%);
    background:#b3b3b3;
    border:5px solid #fff;
    z-index:10;
    transition:background .25s;
}

</style>
</head>

<body>

<div class="stage">

    <div id="t"></div>

    <div id="b" class="center"></div>

</div>

<script>

const chars=["P","P","P","S","S"];

const STEP=210;
const SIDE=.52;

const slides=chars.map(c=>{
    const d=document.createElement("div");
    d.className="slide";
    d.textContent=c;
    t.appendChild(d);
    return d;
});

let cur=0;

const color=()=>`hsl(${Math.random()*360},90%,55%)`;

function render(){

    slides.forEach((s,i)=>{

        let diff=i-cur;

        if(diff>2.5) diff-=5;
        if(diff<-2.5) diff+=5;

        let scale=SIDE;
        let opacity=0;
        let z=1;

        if(diff===0){
            scale=1;
            opacity=1;
            z=3;
        }
        else if(Math.abs(diff)===1){
            opacity=.82;
            z=2;
        }

        s.style.opacity=opacity;
        s.style.zIndex=z;

        s.style.transform=
        `translate(-50%,-50%)
         translateY(${diff*STEP}px)
         scale(${scale})`;

    });

}

render();

setInterval(()=>{

    cur=(cur+1)%chars.length;

    b.style.background=color();

    render();

},1000);

</script>

</body>
</html>
