<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.stage{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

.slide{
    position:absolute;
    left:50%;
    top:50%;
    width:250px;
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:215px;
    font-weight:400;
    color:#c3c3c3;
    transform:translate(-50%,-50%);
    transition:
        transform .45s cubic-bezier(.22,.61,.36,1),
        opacity .35s;
    will-change:transform;
}

.center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:210px;
    aspect-ratio:1;
    background:#b3b3b3;
    border:6px solid #fff;
    z-index:10;
    transition:background .25s;
}

</style>
</head>

<body>

<div class="stage">
    <div id="t"></div>
    <div id="b" class="center"></div>
</div>

<script>

const chars=["P","P","P","S","S"];

const SIDE=.52;

// distância vertical entre os itens
const STEP=window.innerHeight*.38;

const slides=chars.map(c=>{
    const d=document.createElement("div");
    d.className="slide";
    d.textContent=c;
    t.appendChild(d);
    return d;
});

let cur=0;

const randomColor=()=>`hsl(${Math.random()*360},90%,55%)`;

function render(){

    slides.forEach((slide,i)=>{

        let diff=i-cur;

        if(diff>chars.length/2) diff-=chars.length;
        if(diff<-chars.length/2) diff+=chars.length;

        let scale=SIDE;
        let opacity=0;
        let z=1;

        if(diff===0){
            scale=1;
            opacity=1;
            z=3;
        }else if(Math.abs(diff)===1){
            opacity=.82;
            z=2;
        }

        slide.style.opacity=opacity;
        slide.style.zIndex=z;

        slide.style.transform=`
            translate(-50%,-50%)
            translateY(${diff*STEP}px)
            scale(${scale})
        `;

    });

}

render();

setInterval(()=>{
    cur=(cur+1)%chars.length;
    b.style.background=randomColor();
    render();
},1000);

window.addEventListener("resize",()=>{
    render();
});

</script>

</body>
</html>
